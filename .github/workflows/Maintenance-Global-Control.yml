name: Maintenance Global Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "pause"
        type: choice
        options:
          - pause
          - resume
      reason:
        description: "Reason for pause/resume"
        required: false
        default: "Maintenance"

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    # Hosted for public repos so the dispatcher can still start during a
    # fleet outage -- otherwise the fallback below is unreachable.
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' &&
      'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          elif [ "$REPOSITORY_PRIVATE" != "true" ]; then
            # Public repo: standard hosted runners are free and unmetered, so a
            # fleet outage should not take CI down with it.
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No fleet runner online - falling back to free hosted runner"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
  control:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Pause State
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ inputs.action }}" == "pause" ]; then
            echo "Paused by workflow dispatch" > .github/WORKFLOWS_PAUSED
            echo "Reason: ${{ inputs.reason }}" >> .github/WORKFLOWS_PAUSED
            git add .github/WORKFLOWS_PAUSED
            git commit -m "chore(maintenance): pause workflows [${{ inputs.reason }}]"
            git push
          else
            rm -f .github/WORKFLOWS_PAUSED
            git add .github/WORKFLOWS_PAUSED || true
            git commit -m "chore(maintenance): resume workflows"
            git push
          fi
